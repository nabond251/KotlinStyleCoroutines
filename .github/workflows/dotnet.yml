name: .NET 11 CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-pack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            11.0.x
          dotnet-quality: preview

      - name: Restore dependencies
        run: dotnet restore KotlinStyleCoroutines.slnx

      - name: Build solution
        run: dotnet build KotlinStyleCoroutines.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test KotlinStyleCoroutines.slnx --configuration Release --no-build --verbosity normal

      - name: Run sample apps
        run: |
          dotnet run --project samples/CoroutineBasics/CoroutineBasics.csproj --configuration Release --no-build
          dotnet run --project samples/SearchDemo/SearchDemo.csproj --configuration Release --no-build

      - name: Pack NuGet package
        run: dotnet pack src/KotlinStyleCoroutines/KotlinStyleCoroutines.csproj --configuration Release --no-build --output ./artifacts

      - name: Upload NuGet artifact
        uses: actions/upload-artifact@v4
        with:
          name: KotlinStyleCoroutines-nupkg
          path: ./artifacts/*.nupkg
