name: .NET 11 CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build-test-pack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            11.0.x
          dotnet-quality: preview

      - name: Restore dependencies
        run: dotnet restore KotlinStyleCoroutines.slnx

      - name: Build solution
        run: dotnet build KotlinStyleCoroutines.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test KotlinStyleCoroutines.slnx --configuration Release --no-build --verbosity normal

      - name: Run console sample apps
        run: |
          dotnet run --project samples/CoroutineBasics/CoroutineBasics.csproj --configuration Release --no-build
          timeout --foreground -s INT 3s dotnet run --project samples/SearchDemo/SearchDemo.csproj --configuration Release --no-build || [ $? -eq 124 ]

      - name: Pack NuGet packages
        run: |
          dotnet pack src/KotlinStyleCoroutines/KotlinStyleCoroutines.csproj --configuration Release --no-build --output ./artifacts
          dotnet pack src/KotlinStyleCoroutines.Blazor/KotlinStyleCoroutines.Blazor.csproj --configuration Release --no-build --output ./artifacts

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts/*.nupkg
